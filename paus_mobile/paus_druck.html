<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PAUS Druck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* =========================================================
   WARNBOX – DRUCKERHINWEIS (NUR SCREEN)
========================================================= */
.warnbox {
    margin: -90px auto 10px;
    max-width: 280px;
    background: #fff4f4;
    border: 2px solid #c80000;
    border-radius: 14px;
    padding: 12px 16px;
    text-align: center;
    font-weight: 900;
    color: #c80000;
    font-size: 16px;
    box-shadow: 0 0 10px rgba(200,0,0,0.2);
    animation: warnPulse 0.9s ease-in-out infinite;
}

.warnbox span {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-top: 4px;
    color: #7a0000;
}
@keyframes warnPulse {
    0%   { box-shadow: 0 0 6px rgba(200,0,0,0.25); }
    50%  { box-shadow: 0 0 18px rgba(200,0,0,0.55); }
    100% { box-shadow: 0 0 6px rgba(200,0,0,0.25); }
}
@media print {
    .warnbox { display: none !important; }
}

/* =========================================================
   BASIS
========================================================= */
html, body {
    margin: 0;
    padding: 0;
    background: #dcdcdc;
    font-family: Arial, sans-serif;
    height: 100%;
    height: 100dvh;
}

/* =========================================================
   VORSCHAU (A6 QUER)
========================================================= */
.preview-wrapper {
    width: 100%;
    height: calc(100% - 180px);
    height: calc(100dvh - 180px);
    display: flex;
    justify-content: center;
    align-items: center;
}

.preview-area {
    width: 148mm;
    height: 105mm;
    background: white;
    box-shadow: 0 0 15px rgba(0,0,0,0.25);
    transform-origin: center;
    transform: scale(min(calc(92vw / 559.3701px), calc((100dvh - 180px) / 396.8504px)));
}

/* =========================================================
   ETIKETT (LOGIK VORSCHAU + DRUCK IDENTISCH)
========================================================= */
.etikett {
    width: 148mm;
    height: 105mm;
    padding: 8mm;
    box-sizing: border-box;
    position: relative;
}

.etikett-inner {
    width: 100%;
    height: calc(100% - 25mm);
    margin-bottom: 25mm;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.text-block {
    max-width: calc(148mm - 48mm);
    margin: 0 auto;
}

/* Logo + Zusatztext nebeneinander (wie Web) */
.etikett-bottom {
    position: absolute;
    left: 5mm;
    right: 5mm;
    bottom: 4mm;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6mm;
}

.logo {
    width: 40mm;
    filter: grayscale(100%);
    flex-shrink: 0;
}

.zusatztext-side {
    font-size: 20pt;
    font-weight: bold;
    color: #000;
    text-align: right;
}

.line { width: 100%; font-weight: bold; }
.line-title { font-size: 40pt; }
.line-kommission { font-size: 48pt; }
.line-date { font-size: 48pt; }
.line-vorgezogen { font-size: 40pt; }

.date-past {
    border: 3px solid red;
    padding: 1px 8px;
    border-radius: 6px;
    display: inline-block;
}

.bottom-bar {
    margin-top: 20px;
    height: 60px;
    display: flex;
    gap: 16px;
    padding: 0 20px;
}

.btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    font-size: 22px;
    font-weight: bold;
    color: white;
}

.back-btn { background: #444; }
.print-btn { background: #00963d; }

.print-only { display: none; }

@media print {
    @page {
        size: A6 portrait;
        margin: 0;
    }

    html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
    }

    .preview-wrapper,
    .warnbox,
    .bottom-bar {
        display: none !important;
    }

    .print-only {
        display: block !important;
    }

    #printArea {
        width: 105mm;
        height: 148mm;
        position: relative;
        overflow: hidden;
    }

    #printArea.etikett {
        width: 148mm;
        height: 105mm;
        position: absolute;
        top: 21.5mm;
        left: -21.5mm;
        transform: rotate(-90deg);
        transform-origin: center;
    }
}
</style>
</head>

<body>

<!-- ================= VORSCHAU ================= -->
<div class="preview-wrapper">
    <div class="preview-area">
        <div class="etikett">
            <div id="previewContent" class="etikett-inner"></div>
            <div class="etikett-bottom">
                <img src="langen.png" class="logo" alt="">
                <div id="previewZusatz" class="zusatztext-side"></div>
            </div>
        </div>
    </div>
</div>

<div class="warnbox">
    ⚠️ Achtung!<br>
    (<b>A6 Hochformat</b><br>
</div>

<div id="printArea" class="etikett print-only">
    <div id="printContent" class="etikett-inner"></div>
    <div class="etikett-bottom">
        <img src="langen.png" class="logo" alt="">
        <div id="printZusatz" class="zusatztext-side"></div>
    </div>
</div>

<div class="bottom-bar">
    <button class="btn back-btn" id="backBtn">Zurück</button>
    <button class="btn print-btn" id="printBtn">Drucken</button>
</div>

<script>
window.onload = () => {
    const previewInner = document.getElementById("previewContent");
    const printInner   = document.getElementById("printContent");
    const previewZusatz = document.getElementById("previewZusatz");
    const printZusatz   = document.getElementById("printZusatz");
    const printBtn     = document.getElementById("printBtn");
    const backBtn      = document.getElementById("backBtn");

    const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    const qs = new URLSearchParams(location.search);
    const data = JSON.parse(decodeURIComponent(qs.get("data")));

    const kom = data.kommission;
    const dat = data.lieferdatum;
    const farbe = data.farbe;
    const vorgezogen = data.vorgezogen;
    const zusatztext = (data.zusatztext || "").trim();

    let isPast = false;
    let finalDate = dat;

    if (dat) {
        let clean = dat.replace(/\s/g, "");
        let d, m, y;
        if (clean.includes(".")) {
            const parts = clean.split(".").map(p => p.replace(/\D/g, ""));
            d = parts[0];
            m = parts[1];
            y = parts[2];
        } else {
            d = clean.slice(0, 2);
            m = clean.slice(2, 4);
            y = clean.length >= 8 ? clean.slice(4, 8) : "";
        }
        const now = new Date();
        const year = y && y.length >= 2 ? (y.length === 2 ? 2000 + parseInt(y, 10) : parseInt(y, 10)) : now.getFullYear();
        const target = new Date(year, parseInt(m, 10) - 1, parseInt(d, 10));
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diff =
            (today.getFullYear() - target.getFullYear()) * 12 +
            (today.getMonth() - target.getMonth());

        if (target < today && diff < 2) isPast = true;
        finalDate = `${d.padStart(2, "0")}.${m.padStart(2, "0")}`;
    }

    // Wie Web: Zusatztext zählt nicht zur Mitte – steht unten neben Logo
    const offsetMm = vorgezogen ? 4 : 7;
    const html = `
        <div class="text-block" style="transform:translateY(${offsetMm}mm);">
            <div class="line line-title">PAUS</div>
            <div class="line line-kommission" style="color:${farbe};">${esc(kom)}</div>
            <div class="line line-date">
                <span class="${isPast ? "date-past" : ""}">${esc(finalDate)}</span>
            </div>
            ${vorgezogen ? `<div class="line line-vorgezogen" style="color:${farbe};">„Vorgezogen“</div>` : ``}
        </div>
    `;
    const zusatzHtml = zusatztext ? `„${esc(zusatztext)}“` : "";

    previewInner.innerHTML = html;
    printInner.innerHTML   = html;
    previewZusatz.innerHTML = zusatzHtml;
    printZusatz.innerHTML   = zusatzHtml;

    let didPrint = false;
    const isMobileDevice = /android|iphone|ipad|ipod/i.test(navigator.userAgent);

    printBtn.onclick = () => {
        didPrint = true;
        window.print();
    };

    if (!isMobileDevice) {
        window.onafterprint = () => {
            if (!didPrint) return;
            didPrint = false;
            setTimeout(() => {
                window.location.replace("paus_mobile.html?v=" + Date.now());
            }, 300);
        };
    }

    if (isMobileDevice) {
        window.addEventListener("focus", () => {
            if (!didPrint) return;
            didPrint = false;
            setTimeout(() => {
                window.location.replace("paus_mobile.html?v=" + Date.now());
            }, 300);
        });
    }

    backBtn.onclick = () => {
        window.location.replace("paus_mobile.html?v=" + Date.now());
    };
};
</script>

</body>
</html>
