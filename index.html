<link rel="icon" type="image/png" sizes="512x512" href="icon512.png">

<style>
#btnLieferung { display:none; }

/* =====================
   GRUNDLAYOUT
===================== */
html, body {
    margin:0;
    padding:0;
    min-height:100vh;
    background: radial-gradient(circle at top,#f2f5f9 0%,#d8dee6 40%,#c3cad4 100%);
    background-attachment: fixed;
    font-family:"Segoe UI",Arial,sans-serif;
}

@media (min-width:601px){
    html,body{overflow:hidden;}
}

@media (max-width:600px){
    html,body{
        height:100vh;
        height:100dvh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        padding-bottom:calc(52px + env(safe-area-inset-bottom, 0px));
        box-sizing:border-box;
    }
    #main{
        width:100%;
        max-width:380px;
        transform:scale(0.95);
        padding-bottom:8px;
    }
    button{
        width:260px;
        height:85px;
        font-size:24px;
    }
    footer{
        margin-top:24px;
        margin-bottom:4px;
        font-size:14px;
    }
}

/* Zebra TC22: alles auf einem Screen, kein Scroll, Android-Nav frei */
html.zebra-device,
html.zebra-device body,
body.zebra-device{
    height:100svh !important;
    max-height:100svh !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
    display:flex !important;
    justify-content:center !important;
    align-items:stretch !important;
    box-sizing:border-box !important;
}
html.zebra-device #main,
body.zebra-device #main{
    width:100%;
    max-width:100%;
    height:100%;
    max-height:100%;
    transform:none;
    margin:0;
    padding:10px 14px calc(52px + env(safe-area-inset-bottom, 0px));
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
}
html.zebra-device #logo,
body.zebra-device #logo{
    width:58%;
    max-width:200px;
    margin:0 auto 10px;
}
html.zebra-device h1,
body.zebra-device h1{
    margin:0 0 12px;
    font-size:26px;
}
html.zebra-device button,
body.zebra-device button{
    width:100%;
    max-width:100%;
    height:58px;
    font-size:20px;
    margin:8px auto;
    flex-shrink:0;
}
html.zebra-device footer,
body.zebra-device footer{
    margin-top:12px;
    margin-bottom:0;
    font-size:13px;
    flex-shrink:0;
}

@media (min-width:601px){
    #main{
        margin:60px auto;
        width:100%;
        max-width:650px;
        padding:20px 40px;
    }
    button{
        width:450px;
        height:80px;
        font-size:20px;
    }
    h1{font-size:40px;}
}

#logo{
    width:80%;
    max-width:320px;
    margin:0 auto 25px auto;
    display:block;
    cursor:pointer;
}

/* 🔴 Reset Animation */
@keyframes logoFlash {
    0%   { filter:none; }
    50%  { filter:drop-shadow(0 0 18px red) brightness(1.4); }
    100% { filter:none; }
}
.logo-reset{
    animation:logoFlash 0.6s ease-in-out 2;
}

h1{
    margin:0 0 30px 0;
    font-size:32px;
    font-weight:900;
    color:#003a73;
    text-align:center;
}

button{
    margin:18px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:18px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    transition:0.2s;
    line-height:1.2;
    text-align:center;
    padding:0 24px;
}

#btnBeschichtung{ background:linear-gradient(#007bff,#0056b3); }
#btnKanten{ background:linear-gradient(#ff9800,#e67e00); }
#btnPaus{ background:linear-gradient(#28a745,#1d7f31); }

footer{
    margin-top:40px;
    font-size:16px;
    text-align:center;
    color:#444;
}
</style>

<script>
/* =====================
   NAVIGATION
===================== */
(function detectZebra(){
    var ua = navigator.userAgent.toLowerCase();
    var sw = window.screen.width;
    var sh = window.screen.height;
    var dpr = window.devicePixelRatio || 1;
    var isTC22 = ua.indexOf("android") !== -1 && sw === 360 && sh === 720 && dpr === 3;
    var isTC21 = ua.indexOf("android") !== -1 && sw === 360 && sh === 640;
    var isZebra = isTC22 || isTC21 || ua.indexOf("zebra") !== -1;
    function apply(){
        var root = document.documentElement;
        var body = document.body;
        if (isZebra) {
            root.classList.add("zebra-device");
            if (body) body.classList.add("zebra-device");
        }
        if (isTC22) {
            root.classList.add("zebra-tc22");
            if (body) body.classList.add("zebra-tc22");
        }
        if (isTC21) {
            root.classList.add("zebra-tc21");
            if (body) body.classList.add("zebra-tc21");
        }
    }
    apply();
    if (!document.body) document.addEventListener("DOMContentLoaded", apply);
})();

function openBeschichtung(){
    location.href="beschichtung_mobile/beschichtung.html?besc35=" + Date.now();
}
function openKanten(){
    location.href="kanten_mobile/bearbeitung.html?v=" + Date.now();
}
function openLieferung(){
    location.href="index2.html";
}
function openPaus(){
    location.href="paus_mobile/paus_mobile.html?v=" + Date.now();
}

/* =================================================
   🔑 ZENTRIERUNG PRÜFEN
================================================= */
function checkCenteredOnce(){
    if(sessionStorage.getItem("index-layout-ok")) return;

    const main=document.getElementById("main");
    if(!main) return;

    const rect=main.getBoundingClientRect();
    const viewportCenter=window.innerWidth/2;
    const mainCenter=rect.left+rect.width/2;
    const diff=Math.abs(viewportCenter-mainCenter);

    if(diff>20){
        sessionStorage.setItem("index-layout-ok","reloaded");
        location.reload();
    }else{
        sessionStorage.setItem("index-layout-ok","ok");
    }
}

window.addEventListener("load",()=>{setTimeout(checkCenteredOnce,60);});
window.addEventListener("pageshow",()=>{setTimeout(checkCenteredOnce,60);});
        
</script>

</head>
<body>

<div id="main">

<img id="logo" src="langen.png" alt="Langen CNC Logo">

<h1>Warenanhänger</h1>

<button id="btnKanten" onclick="openKanten()">Bearbeitung (A6)</button>
<button id="btnBeschichtung" onclick="openBeschichtung()">Beschichtung (A5)</button>
<button id="btnLieferung" onclick="openLieferung()">Lieferung (A6)</button>
<button id="btnPaus" onclick="openPaus()">PAUS Lieferung (A6)</button>

<footer>Langen CNC Metalltechnik GmbH & Co. KG</footer>

</div>

</body>
</html>
